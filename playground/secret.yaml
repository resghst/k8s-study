# DEMO ONLY. Never commit a real Secret to git — the value below is fake and
# base64 is NOT encryption (anyone can decode it). In real projects create
# Secrets out-of-band (kubectl create secret, a sealed-secrets/external-secrets
# operator, or your cloud's secret manager), not as a plain manifest in the repo.
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque
stringData:
  # stringData takes plain text; Kubernetes base64-encodes it into data on apply
  DB_PASSWORD: s3cr3t
